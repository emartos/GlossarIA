services:
  glossaria:
    build: .
    container_name: glossaria-app
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    command: sh -c "cd web && node dist/server/entry.mjs"
    # En producción usamos el contenido de la imagen generada por el build
    # Los volúmenes se mantienen solo para el servicio de build para persistir resultados si se desea

  glossaria-build:
    build: .
    container_name: glossaria-build
    environment:
      - NODE_ENV=production
    command: sh -c "echo '🏗️ Building project inside container...' \
      && echo '📦 Installing dependencies...' \
      && cd web && npm install \
      && cd ../scripts && npm install \
      && echo '⚙️ Validating CSV and generating JSON...' \
      && node validate-csv.js && node generate-json.js \
      && echo '🔨 Building web application...' \
      && cd ../web && npm run build \
      && echo '✅ Project built successfully inside container'"
    profiles:
      - build
    volumes:
      - ./web/dist/server:/app/web/dist/server
      - ./web/dist/client:/app/web/dist/client
      - ./web/public/data:/app/web/public/data
      - ./data:/app/data
